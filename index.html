<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python VS Java</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="container">

        <!-- Lado Python -->
        <div class="lado python">
            <h1>PYTHON</h1>

            <ul>
                <li>Simple y fácil de aprender</li>
                <li>Desarrollo rápido</li>
                <li>Tipado dinámico</li>
                <li>Ideal para IA y Data Science</li>
                <li>Muchas librerías</li>
            </ul>
        </div>

        <!-- Centro -->
        <div class="centro">
            <div class="vs">VS</div>
        </div>

        <!-- Lado Java -->
        <div class="lado java">
            <h1>JAVA</h1>

            <ul>
                <li>Más estructurado</li>
                <li>Muy rápido y potente</li>
                <li>Tipado estático</li>
                <li>Ideal para Android</li>
                <li>Muy usado en empresas</li>
            </ul>
        </div>

    </div>

</body>
</html>
